name: pose_runner
description: Body-controlled runner game. Session 2 - pose test with crash log.
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: '>=0.11.0 <1.0.0'
  flame: '>=1.18.0 <2.0.0'
  google_mlkit_commons: '>=0.7.0 <1.0.0'
  google_mlkit_pose_detection: '>=0.14.0 <1.0.0'
  path_provider: '>=2.1.0 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0'

flutter:
  uses-material-design: true
